name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install --no-progress
        working-directory: server
      - run: npm run test-local
        working-directory: server
      - run: npm run test-dom
        working-directory: server

  build-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install --no-progress
        working-directory: server
      # regenerates the workspace; the Pods themselves are checked in
      - run: pod install
      - run: >
          set -o pipefail &&
          xcodebuild
          -workspace Gailan.xcworkspace
          -scheme Gailan
          -configuration Release
          CODE_SIGN_IDENTITY=-
          CODE_SIGNING_REQUIRED=NO
          build | tail -80
