name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install --no-progress
        working-directory: server
      - run: npm run test-local
        working-directory: server
      # tape-run needs electron, and electron cannot install on node 26:
      # extract-zip never settles, so the postinstall reports success without
      # unpacking a binary. Run these by hand on an older node for now.
      - run: npm run test-browser
        working-directory: server
        continue-on-error: true
