name: test

on:
  push:
    branches: [master]
  pull_request:

# Every job here wants a macOS runner, and those are handed out a few at a time.
# Without this, a run of pushes queues eight deep and the newest commit waits behind
# commits nobody is interested in any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/checkout@v7
        with:
          # the new-code gate diffs against the base, so it needs the history
          fetch-depth: 0
      - run: npm install --no-progress
        working-directory: server
      # runs every suite and holds the total to a floor. macOS only, which this
      # job is: elsewhere fsevents is a stub and the watcher specs cannot pass.
      - run: npm run coverage
        working-directory: server
      - name: coverage of the lines this change touched
        working-directory: server
        env:
          COVERAGE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: npm run coverage:new

  build-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-progress
        working-directory: server
      # regenerates the workspace; the Pods themselves are checked in
      - run: pod install
      - run: >
          set -o pipefail &&
          xcodebuild
          -workspace Gailan.xcworkspace
          -scheme Gailan
          -configuration Release
          CODE_SIGN_IDENTITY=-
          CODE_SIGNING_REQUIRED=NO
          build | tail -80
