name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install --no-progress
        working-directory: server
      - run: npm run test-local
        working-directory: server
      - run: npm run test-dom
        working-directory: server
